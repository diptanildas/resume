name: CI/CD Pipeline
run-name: ${{ github.actor }} triggered CI/CD Pipeline 🚀
on: [push, workflow_dispatch]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    env:
      FILE_NAME: "Diptanil_Das_Resume.pdf"
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          extra_system_packages: unzip
          pre_compile: |
            set -e
            DEST="$(kpsewhich -var-value TEXMFLOCAL)/fonts/type1/urw/garamond"
            mkdir -p "$DEST"
            for M in \
              https://ctan.math.illinois.edu/fonts/urw/garamond.zip \
              https://ftp.fau.de/ctan/fonts/urw/garamond.zip \
              https://mirrors.ctan.org/fonts/urw/garamond.zip ; do
              echo "Fetching Garamond from $M"
              curl -fsSL --connect-timeout 25 --retry 2 -o /tmp/garamond.zip "$M" && break
            done
            unzip -o -j /tmp/garamond.zip 'garamond/ugm*.pfb' -d "$DEST"
            mktexlsr

      - name: Rename PDF
        run: mv main.pdf ${{ env.FILE_NAME }}

      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: ${{ env.FILE_NAME }}
