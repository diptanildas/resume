name: CI/CD Pipeline
run-name: ${{ github.actor }} triggered CI/CD Pipeline 🚀
on: [push, workflow_dispatch]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    env:
      FILE_NAME: "Diptanil_Das_Resume_Java_Full_Stack_Developer.pdf"
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Extract Garamond fonts
        run: unzip -o fonts/garamond.zip -d fonts/extracted

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          # mathdesign/urw-garamond loads the URW GaramondNo8 Type 1 fonts
          # through kpathsea, so the .pfb files must live in a texmf tree;
          # fontconfig-based installation (extra_fonts) is not enough.
          pre_compile: |
            TEXMF="$(kpsewhich -var-value TEXMFLOCAL)"
            mkdir -p "$TEXMF/fonts/type1/urw/garamond" "$TEXMF/fonts/afm/urw/garamond"
            cp fonts/extracted/garamond/*.pfb "$TEXMF/fonts/type1/urw/garamond/"
            cp fonts/extracted/garamond/*.afm "$TEXMF/fonts/afm/urw/garamond/"
            mktexlsr

      - name: Rename PDF
        run: mv main.pdf ${{ env.FILE_NAME }}

      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: ${{ env.FILE_NAME }}
